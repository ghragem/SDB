<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem conexão · Saindo do Bairro</title>
<style>
  :root { --bg:#0a0a0b; --text:#f3f2ef; --muted:#a09d97; --accent:#e8302a; color-scheme:dark; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:340px; }
  h1 { font-size:22px; margin:0 0 8px; letter-spacing:-0.01em; }
  p { color:var(--muted); margin:0 0 20px; }
  button { height:44px; padding:0 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Sem conexão.</h1>
  <p>Seus dados ficam no banco, não no aparelho. Quando a internet voltar, tudo continua de onde parou.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>
